name: lint
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff-undefined-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - name: Static check for undefined names (F821)
        run: ruff check --select F821 backend/
