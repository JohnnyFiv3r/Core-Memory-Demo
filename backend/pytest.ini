[pytest]
filterwarnings =
    # qdrant-client emits these from the pinned Core Memory FastEmbed path. The
    # upstream fix belongs in Core Memory; keep the demo suite warning-clean.
    ignore:`query` method has been deprecated and will be removed in 1\.17\..*:UserWarning:qdrant_client\.common\.client_warnings
    ignore:`add` method has been deprecated and will be removed in 1\.17\..*:UserWarning:qdrant_client\.common\.client_warnings
    # Kuzu's native bindings emit CPython import deprecation noise.
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
