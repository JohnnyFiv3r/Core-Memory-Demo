services:
  - type: web
    name: core-memory-demo-backend
    env: python
    rootDir: backend
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_ORIGIN
        sync: false
      - key: CORE_MEMORY_ROOT
        value: /tmp/core-memory
      - key: CORE_MEMORY_DEMO_BENCHMARK_ROOT
        value: /tmp/core-memory-bench
      - key: CORE_MEMORY_DEMO_ARTIFACTS_ROOT
        value: /tmp/core-memory-artifacts
      - key: BENCHMARK_RUN_MODE
        value: queue
      - key: BENCHMARK_DATABASE_URL
        sync: false
      - key: CORE_MEMORY_VECTOR_BACKEND
        value: qdrant
      - key: CORE_MEMORY_GRAPH_BACKEND
        value: kuzu
      - key: CORE_MEMORY_CLAIM_LAYER
        value: "1"
      - key: CORE_MEMORY_CLAIM_EXTRACTION_MODE
        value: heuristic
      - key: CORE_MEMORY_CLAIM_RESOLUTION
        value: "1"
      # Myelination retrieval-feedback learning loop (v1.1.1): applies the
      # precomputed bonus manifest during recall. Enabled for the hosted demo.
      - key: CORE_MEMORY_MYELINATION_ENABLED
        value: "1"
      # Multi-store recall fan-out (v1.1.1) is opt-in: recall fans out to these
      # external stores only when the corresponding var is set. Left unset here.
      - key: SATORID_RAGIE_API_KEY
        sync: false
      - key: SATORID_PIPEHOUSE_URL
        sync: false
      - key: SATORID_STORE_WEIGHTS
        sync: false
      - key: DEMO_CONTEXT_BUDGET
        value: "128000"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: cron
    name: core-memory-demo-benchmark-worker
    env: python
    rootDir: backend
    plan: starter
    region: oregon
    branch: main
    schedule: "*/1 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.benchmarks.benchmark_worker --once
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORE_MEMORY_ROOT
        value: /var/data/core-memory
      - key: CORE_MEMORY_DEMO_BENCHMARK_ROOT
        value: /var/data/core-memory-bench
      - key: CORE_MEMORY_DEMO_ARTIFACTS_ROOT
        value: /var/data/core-memory-artifacts
      - key: BENCHMARK_DATABASE_URL
        sync: false
      - key: CORE_MEMORY_VECTOR_BACKEND
        value: qdrant
      - key: CORE_MEMORY_GRAPH_BACKEND
        value: kuzu
      - key: FASTEMBED_CACHE_PATH
        value: /var/data/fastembed-cache
      - key: CORE_MEMORY_CLAIM_LAYER
        value: "1"
      - key: CORE_MEMORY_CLAIM_EXTRACTION_MODE
        value: heuristic
      - key: CORE_MEMORY_CLAIM_RESOLUTION
        value: "1"
      # Keep the myelination-update async job aligned with the web service.
      - key: CORE_MEMORY_MYELINATION_ENABLED
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

disks:
  - name: core-memory-demo-data
    mountPath: /var/data
    sizeGB: 20
