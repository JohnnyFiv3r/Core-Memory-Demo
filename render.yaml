services:
  - type: web
    name: core-memory-demo-backend
    env: python
    rootDir: backend
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: core-memory-demo-data
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_ORIGIN
        sync: false
      - key: CORE_MEMORY_ROOT
        value: /var/data/core-memory
      - key: CORE_MEMORY_DEMO_BENCHMARK_ROOT
        value: /var/data/core-memory-bench
      - key: CORE_MEMORY_DEMO_ARTIFACTS_ROOT
        value: /var/data/core-memory-artifacts
      - key: BENCHMARK_RUN_MODE
        value: queue
      - key: BENCHMARK_DATABASE_URL
        sync: false
      - key: CORE_MEMORY_VECTOR_BACKEND
        value: qdrant
      - key: CORE_MEMORY_QDRANT_PATH
        value: /var/data/core-memory/.beads/qdrant
      - key: CORE_MEMORY_GRAPH_BACKEND
        value: kuzu
      - key: CORE_MEMORY_KUZU_PATH
        value: /var/data/core-memory/.beads/kuzu
      - key: CORE_MEMORY_CLAIM_LAYER
        value: "1"
      - key: CORE_MEMORY_CLAIM_EXTRACTION_MODE
        value: heuristic
      - key: CORE_MEMORY_CLAIM_RESOLUTION
        value: "1"
      # Myelination retrieval-feedback learning loop (v1.1.1): applies the
      # precomputed bonus manifest during recall. Enabled for the hosted demo.
      - key: CORE_MEMORY_MYELINATION_ENABLED
        value: "1"
      # Causal-traversal recall tuning (PR #170). Defaults match Core-Memory;
      # surfaced here so seed breadth / merge budget can be tuned without a
      # Core-Memory redeploy. Wider seed than the old hardcoded top-5 so
      # gold-adjacent beads ranked just outside the top results still seed
      # traversal; chain beads get slots beyond k so traversal evidence reaches
      # the scored top-k.
      - key: CORE_MEMORY_TRACE_SEED_ANCHORS
        value: "12"
      - key: CORE_MEMORY_TRACE_CHAIN_MERGE_BONUS
        value: "8"
      - key: CORE_MEMORY_TRACE_MAX_DEPTH
        value: "3"
      - key: CORE_MEMORY_TRACE_MAX_CHAINS
        value: "12"
      # Multi-store recall fan-out (v1.1.1) is opt-in: recall fans out to these
      # external stores only when the corresponding var is set. Left unset here.
      - key: SATORID_RAGIE_API_KEY
        sync: false
      - key: SATORID_PIPEHOUSE_URL
        sync: false
      - key: SATORID_STORE_WEIGHTS
        sync: false
      - key: DEMO_CONTEXT_BUDGET
        value: "128000"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: cron
    name: core-memory-demo-benchmark-worker
    env: python
    rootDir: backend
    plan: starter
    region: oregon
    branch: main
    schedule: "*/1 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.benchmarks.benchmark_worker --once
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORE_MEMORY_ROOT
        value: /var/data/core-memory
      - key: CORE_MEMORY_DEMO_BENCHMARK_ROOT
        value: /var/data/core-memory-bench
      - key: CORE_MEMORY_DEMO_ARTIFACTS_ROOT
        value: /var/data/core-memory-artifacts
      - key: BENCHMARK_DATABASE_URL
        sync: false
      - key: CORE_MEMORY_VECTOR_BACKEND
        value: qdrant
      - key: CORE_MEMORY_QDRANT_PATH
        value: /var/data/core-memory/.beads/qdrant
      - key: CORE_MEMORY_GRAPH_BACKEND
        value: kuzu
      - key: CORE_MEMORY_KUZU_PATH
        value: /var/data/core-memory/.beads/kuzu
      - key: FASTEMBED_CACHE_PATH
        value: /var/data/fastembed-cache
      - key: CORE_MEMORY_CLAIM_LAYER
        value: "1"
      - key: CORE_MEMORY_CLAIM_EXTRACTION_MODE
        value: heuristic
      - key: CORE_MEMORY_CLAIM_RESOLUTION
        value: "1"
      # Keep the myelination-update async job aligned with the web service.
      - key: CORE_MEMORY_MYELINATION_ENABLED
        value: "1"
      # Causal-traversal recall tuning (PR #170) — keep the worker aligned with
      # the web service so benchmark recall behaves identically.
      - key: CORE_MEMORY_TRACE_SEED_ANCHORS
        value: "12"
      - key: CORE_MEMORY_TRACE_CHAIN_MERGE_BONUS
        value: "8"
      - key: CORE_MEMORY_TRACE_MAX_DEPTH
        value: "3"
      - key: CORE_MEMORY_TRACE_MAX_CHAINS
        value: "12"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
