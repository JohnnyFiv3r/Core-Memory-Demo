services:
  - type: web
    name: core-memory-demo-backend
    env: python
    rootDir: backend
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGIN
        sync: false
      - key: CORE_MEMORY_ROOT
        value: /tmp/core-memory
      - key: CORE_MEMORY_DEMO_BENCHMARK_ROOT
        value: /tmp/core-memory-bench
      - key: CORE_MEMORY_DEMO_ARTIFACTS_ROOT
        value: /tmp/core-memory-artifacts
      - key: BENCHMARK_RUN_MODE
        value: queue
      - key: BENCHMARK_DATABASE_URL
        sync: false
      - key: CORE_MEMORY_VECTOR_BACKEND
        value: pgvector
      - key: CORE_MEMORY_CANONICAL_SEMANTIC_MODE
        value: required
      - key: CORE_MEMORY_EMBEDDINGS_PROVIDER
        value: openai
      - key: CORE_MEMORY_CLAIM_LAYER
        value: "1"
      - key: CORE_MEMORY_CLAIM_EXTRACTION_MODE
        value: heuristic
      - key: CORE_MEMORY_CLAIM_RESOLUTION
        value: "1"
      - key: DEMO_CONTEXT_BUDGET
        value: "128000"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: cron
    name: core-memory-demo-benchmark-worker
    env: python
    rootDir: backend
    plan: pro plus
    region: oregon
    branch: main
    schedule: "*/1 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.benchmarks.benchmark_worker --once
    envVars:
      - key: APP_ENV
        value: production
      - key: CORE_MEMORY_ROOT
        value: /tmp/core-memory
      - key: CORE_MEMORY_DEMO_BENCHMARK_ROOT
        value: /tmp/core-memory-bench
      - key: CORE_MEMORY_DEMO_ARTIFACTS_ROOT
        value: /tmp/core-memory-artifacts
      - key: BENCHMARK_DATABASE_URL
        sync: false
      - key: CORE_MEMORY_VECTOR_BACKEND
        value: pgvector
      - key: CORE_MEMORY_CANONICAL_SEMANTIC_MODE
        value: required
      - key: CORE_MEMORY_EMBEDDINGS_PROVIDER
        value: openai
      - key: CORE_MEMORY_CLAIM_LAYER
        value: "1"
      - key: CORE_MEMORY_CLAIM_EXTRACTION_MODE
        value: heuristic
      - key: CORE_MEMORY_CLAIM_RESOLUTION
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

disks:
  - name: core-memory-demo-data
    mountPath: /var/data
    sizeGB: 20
